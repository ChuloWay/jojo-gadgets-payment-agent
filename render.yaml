services:
  - type: web
    name: jojo-gadgets-payment-agent
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jojo-gadgets-db
          property: connectionString
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: PAYMENT_WINDOW_MINUTES
        value: "30"
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: CHORD_PROACTIVE_NOTIFICATIONS
        value: "false"
      - key: CHORD_API_BASE_URL
        value: https://api.chordhq.xyz
      - key: CHORD_API_KEY
        sync: false
      - key: CHORD_WORKSPACE_ID
        value: ws-e923ea40-e9ce-4dd6-bc51-76153e6e56f0
      - key: CHORD_TEAMMATE_ID
        value: e2560ec0-ccea-45ab-8889-ea09bfdfb59e

databases:
  - name: jojo-gadgets-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: gadget_agent
    user: gadget_agent
    ipAllowList: []
